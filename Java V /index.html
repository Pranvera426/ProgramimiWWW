<!doctype html>
<html lang="sq">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Formulari i misionit sekret</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <a class="skip" href="#main">Kalo te përmbajtja</a>
    
    <main id="main">
      <h1>Regjistro misionin</h1>
      <p class="subtitle">Demonstrim lokal: përdor vetëm të dhëna të sajuara. Nuk kryhet regjistrim real.</p>

      <form action="pranuar.html" method="get">
        <!-- Pseudonimi -->
        <div class="form-group">
          <label for="pseudonimi">Pseudonimi (3–20 karaktere)</label>
          <input type="text" id="pseudonimi" name="pseudonimi" minlength="3" maxlength="20" required />
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email">Email i sajuar</label>
          <input type="email" id="email" name="email" placeholder="student@example.org" required />
        </div>

        <!-- Persona -->
        <div class="form-group">
          <label for="persona">Persona (1–5)</label>
          <input type="number" id="persona" name="persona" min="1" max="5" required class="input-small" />
        </div>

        <!-- Kategoria -->
        <fieldset>
          <legend>Kategoria</legend>
          <label class="radio-label">
            <input type="radio" name="kategoria" value="art" required />
            Art
          </label>
          <label class="radio-label">
            <input type="radio" name="kategoria" value="shkence" required />
            Shkencë
          </label>
        </fieldset>

        <!-- Checkbox -->
        <div class="form-group checkbox-group">
          <label>
            <input type="checkbox" name="rregullat" required />
            I pranoj rregullat e demonstrimit
          </label>
        </div>

        <!-- Butoni -->
        <button type="submit">Kontrollo formularin</button>
      </form>

      <!-- Tabela -->
      <table>
        <caption>Oraret e misioneve</caption>
        <thead>
          <tr>
            <th scope="col">Ora</th>
            <th scope="col">Misioni</th>
            <th scope="col">Vendi</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row">10:00</th>
            <td>Gjej shenjën</td>
            <td>Oborri</td>
          </tr>
          <tr>
            <th scope="row">12:00</th>
            <td>Lexo hartën</td>
            <td>Biblioteka</td>
          </tr>
          <tr>
            <th scope="row">14:00</th>
            <td>Zbulo objektin</td>
            <td>Laboratori</td>
          </tr>
        </tbody>
      </table>
    </main>
  </body>
</html>
